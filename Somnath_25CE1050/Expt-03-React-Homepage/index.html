<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechVault - Developer Hardware Storefront (React.js)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- React 18 & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #0f172a;
            --accent: #ec4899;
            --bg-dark: #0b0f19;
            --card-bg: #111827;
            --text-light: #f9fafb;
            --text-muted: #9ca3af;
            --border: #1f2937;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); line-height: 1.6; }

        .student-banner {
            background: #090d16; color: #9ca3af; padding: 8px 24px; font-size: 0.8rem;
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border);
            flex-wrap: wrap; gap: 8px;
        }
        .student-banner strong { color: #818cf8; }

        /* Navbar */
        .navbar {
            background: rgba(17, 24, 39, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
            padding: 16px 36px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
        }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #ffffff; }
        .brand-icon {
            background: rgba(99, 102, 241, 0.2); color: #818cf8; font-size: 1.5rem; font-weight: 900;
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px;
        }
        .brand-text { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }

        .nav-links { display: flex; gap: 24px; list-style: none; }
        .nav-links a { text-decoration: none; color: #d1d5db; font-weight: 600; font-size: 0.92rem; transition: color 0.2s; }
        .nav-links a:hover { color: #818cf8; }

        .nav-actions { display: flex; gap: 12px; align-items: center; }
        .btn {
            padding: 9px 18px; border-radius: 8px; font-size: 0.88rem; font-weight: 600; cursor: pointer; border: none;
            transition: all 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: var(--primary); color: #ffffff; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-cart { background: #1f2937; border: 1.5px solid var(--border); color: #f9fafb; }
        .btn-cart:hover { border-color: var(--primary); }

        /* Hero */
        .hero {
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 50%, #090d16 100%);
            color: #ffffff; padding: 70px 36px 60px 36px; text-align: center; border-bottom: 1px solid var(--border);
        }
        .hero-tag {
            display: inline-block; background: rgba(99, 102, 241, 0.2); border: 1px solid rgba(99, 102, 241, 0.4);
            padding: 6px 16px; border-radius: 999px; font-size: 0.82rem; font-weight: 700; color: #c7d2fe; margin-bottom: 18px;
        }
        .hero h1 { font-size: 2.9rem; font-weight: 800; line-height: 1.2; max-width: 860px; margin: 0 auto 16px auto; }
        .hero p { font-size: 1.15rem; max-width: 680px; margin: 0 auto 28px auto; color: #cbd5e1; }
        .hero-cta { display: flex; justify-content: center; gap: 14px; margin-bottom: 40px; }
        .hero-btn-white { background: #ffffff; color: #1e1b4b; font-weight: 700; }
        .hero-btn-white:hover { background: #e0e7ff; }

        /* Stats Bar */
        .stats-bar {
            display: flex; justify-content: space-around; max-width: 920px; margin: 0 auto;
            background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(10px); border-radius: var(--radius);
            padding: 20px 10px; border: 1px solid var(--border);
        }
        .stat-item h3 { font-size: 1.8rem; font-weight: 800; color: #818cf8; }
        .stat-item p { font-size: 0.82rem; color: #9ca3af; }

        /* Catalog Section */
        .section-container { max-width: 1180px; margin: 50px auto; padding: 0 24px; }
        .section-header { text-align: center; margin-bottom: 36px; }
        .section-header h2 { font-size: 2rem; color: #ffffff; font-weight: 800; margin-bottom: 6px; }
        .section-header p { color: var(--text-muted); font-size: 1rem; }

        /* Filter Tabs */
        .filter-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .filter-tab {
            padding: 8px 18px; background: #111827; border: 1.5px solid var(--border); border-radius: 999px;
            font-size: 0.85rem; font-weight: 600; cursor: pointer; color: #9ca3af; transition: all 0.2s;
        }
        .filter-tab.active, .filter-tab:hover { background: var(--primary); color: #ffffff; border-color: var(--primary); }

        /* Product Cards */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
        .product-card {
            background: #111827; border: 1px solid var(--border); border-radius: var(--radius); padding: 24px;
            display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s, border-color 0.2s;
        }
        .product-card:hover { transform: translateY(-4px); border-color: #6366f1; }
        .card-icon {
            width: 48px; height: 48px; border-radius: 10px; background: rgba(99, 102, 241, 0.15);
            display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin-bottom: 14px;
        }
        .product-card h3 { font-size: 1.2rem; font-weight: 700; color: #ffffff; margin-bottom: 6px; }
        .product-card p { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 14px; }
        .price-tag { font-size: 1.35rem; font-weight: 800; color: #34d399; margin-bottom: 16px; }
        .stock-tag { display: inline-block; font-size: 0.72rem; font-weight: 700; background: rgba(16, 185, 129, 0.15); color: #34d399; padding: 2px 8px; border-radius: 4px; margin-bottom: 12px; }

        .footer { background: #090d16; border-top: 1px solid var(--border); color: #9ca3af; padding: 40px 24px 20px 24px; margin-top: 60px; }
        .footer-grid { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 32px; margin-bottom: 30px; }
        .footer h4 { color: #ffffff; font-size: 1rem; margin-bottom: 12px; }
        .footer ul { list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; }
        .footer ul a { color: #9ca3af; text-decoration: none; }
        .footer ul a:hover { color: #818cf8; }
        .footer-bottom { text-align: center; border-top: 1px solid var(--border); padding-top: 20px; font-size: 0.8rem; }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 12px; }
            .hero h1 { font-size: 2.1rem; }
            .stats-bar { flex-direction: column; gap: 14px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function StudentBanner() {
            return (
                <div className="student-banner">
                    <div>SBL-AWT | <strong>Experiment 03: React.js Homepage</strong></div>
                    <div>Student: <strong>Somnath Jha (25CE1050)</strong> | RAIT Computer Engineering</div>
                </div>
            );
        }

        function Navbar({ cartCount, onCartClick }) {
            return (
                <nav className="navbar">
                    <a href="#home" className="brand">
                        <div className="brand-icon">⚡</div>
                        <span className="brand-text">TechVault</span>
                    </a>
                    <ul className="nav-links">
                        <li><a href="#home">Home</a></li>
                        <li><a href="#catalog">Hardware Catalog</a></li>
                        <li><a href="#specs">Custom Rigs</a></li>
                        <li><a href="#support">Enterprise</a></li>
                    </ul>
                    <div className="nav-actions">
                        <button className="btn btn-cart" onClick={onCartClick}>
                            🛒 Cart ({cartCount})
                        </button>
                        <button className="btn btn-primary" onClick={() => alert("Redirecting to Developer Account Login...")}>
                            Sign In
                        </button>
                    </div>
                </nav>
            );
        }

        function HeroSection() {
            return (
                <section id="home" className="hero">
                    <div className="hero-tag">NEXT-GEN DEVELOPER WORKSTATIONS &amp; ACCESSORIES</div>
                    <h1>Equip Your Ultimate Engineering Battle Station</h1>
                    <p>
                        High-performance developer workstations, 240Hz curved OLED displays, hot-swappable mechanical keyboards, and dedicated AI GPU clusters.
                    </p>
                    <div className="hero-cta">
                        <a href="#catalog" className="btn btn-primary hero-btn-white">Explore Hardware Catalog &rarr;</a>
                        <button className="btn btn-cart" onClick={() => alert("Custom PC Configurator wizard initialized.")}>
                            🛠️ Configure Custom Rig
                        </button>
                    </div>
                    <div className="stats-bar">
                        <div className="stat-item">
                            <h3>100,000+</h3>
                            <p>Engineers Equipped</p>
                        </div>
                        <div className="stat-item">
                            <h3>99.98%</h3>
                            <p>Hardware Reliability</p>
                        </div>
                        <div className="stat-item">
                            <h3>24 Hours</h3>
                            <p>Express Dispatch</p>
                        </div>
                        <div className="stat-item">
                            <h3>3 Years</h3>
                            <p>Zero-Downtime Warranty</p>
                        </div>
                    </div>
                </section>
            );
        }

        function ProductCatalog({ onAddToCart }) {
            const [selectedCategory, setSelectedCategory] = useState("All");

            const products = [
                {
                    id: 1,
                    category: "Workstations",
                    title: "Apex-Pro Developer Workstation",
                    desc: "AMD Ryzen 9 7950X, 64GB DDR5, 2TB Gen4 NVMe, Liquid Cooling.",
                    price: "₹1,85,000",
                    icon: "🖥️"
                },
                {
                    id: 2,
                    category: "Monitors",
                    title: "Titan-X 49\" Curved OLED Display",
                    desc: "5120x1440 Dual-QHD, 240Hz, 0.03ms GtG, USB-C 90W PD, KVM Switch.",
                    price: "₹1,15,000",
                    icon: "📺"
                },
                {
                    id: 3,
                    category: "Keyboards",
                    title: "Keychron Q1 Pro Wireless Mechanical",
                    desc: "CNC Aluminum Body, Hot-swappable, Gateron Oil King Switches, QMK/VIA.",
                    price: "₹16,499",
                    icon: "⌨️"
                },
                {
                    id: 4,
                    category: "AI Accelerators",
                    title: "NVIDIA RTX 4090 24GB AI Station",
                    desc: "Ada Lovelace Architecture, 16,384 CUDA Cores, TensorRT LLM Optimized.",
                    price: "₹1,72,000",
                    icon: "⚡"
                },
                {
                    id: 5,
                    category: "Workstations",
                    title: "Mac Studio M2 Ultra (Refurbished/Certified)",
                    desc: "24-Core CPU, 60-Core GPU, 64GB Unified Memory, 1TB SSD.",
                    price: "₹2,45,000",
                    icon: "💻"
                },
                {
                    id: 6,
                    category: "Monitors",
                    title: "Dell UltraSharp 32\" 4K USB-C Hub Monitor",
                    desc: "IPS Black Technology, 98% DCI-P3, RJ45 Ethernet, 90W Power Delivery.",
                    price: "₹68,900",
                    icon: "🖥️"
                }
            ];

            const filtered = selectedCategory === "All"
                ? products
                : products.filter(p => p.category === selectedCategory);

            return (
                <section id="catalog" className="section-container">
                    <div className="section-header">
                        <h2>Featured Developer Hardware</h2>
                        <p>Curated workstations and peripherals built specifically for high-load programming & AI training</p>
                    </div>

                    <div className="filter-tabs">
                        {["All", "Workstations", "Monitors", "Keyboards", "AI Accelerators"].map(cat => (
                            <button
                                key={cat}
                                className={`filter-tab ${selectedCategory === cat ? 'active' : ''}`}
                                onClick={() => setSelectedCategory(cat)}
                            >
                                {cat}
                            </button>
                        ))}
                    </div>

                    <div className="cards-grid">
                        {filtered.map(p => (
                            <div key={p.id} className="product-card">
                                <div>
                                    <div className="card-icon">{p.icon}</div>
                                    <span className="stock-tag">● IN STOCK</span>
                                    <h3>{p.title}</h3>
                                    <p>{p.desc}</p>
                                </div>
                                <div>
                                    <div className="price-tag">{p.price}</div>
                                    <button
                                        className="btn btn-primary"
                                        style={{ width: '100%' }}
                                        onClick={() => onAddToCart(p.title)}
                                    >
                                        Add to Cart 🛒
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                </section>
            );
        }

        function Footer() {
            return (
                <footer className="footer">
                    <div className="footer-grid">
                        <div>
                            <h4>TechVault Hardware Hub</h4>
                            <p style={{ fontSize: '0.85rem' }}>
                                Premier developer equipment supplier for software engineers, research laboratories, and tech startups.
                            </p>
                        </div>
                        <div>
                            <h4>Categories</h4>
                            <ul>
                                <li><a href="#catalog">Workstations</a></li>
                                <li><a href="#catalog">Curved Monitors</a></li>
                                <li><a href="#catalog">Mechanical Keyboards</a></li>
                                <li><a href="#catalog">AI Compute</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4>Customer Assurance</h4>
                            <ul>
                                <li>Pan-India Express Logistics</li>
                                <li>3-Year Advanced Hardware Replacement</li>
                                <li>Corporate GST Invoicing</li>
                            </ul>
                        </div>
                    </div>
                    <div className="footer-bottom">
                        <p>&copy; 2026 TechVault E-Commerce Suite | Skill Based Lab - Advanced Web Technology | Somnath Jha (25CE1050)</p>
                    </div>
                </footer>
            );
        }

        function App() {
            const [cartCount, setCartCount] = useState(2);

            const handleAddToCart = (productTitle) => {
                setCartCount(prev => prev + 1);
                alert(`Added to Cart: "${productTitle}"!\nTotal Items in Cart: ${cartCount + 1}`);
            };

            const handleCartView = () => {
                alert(`TechVault Cart contains ${cartCount} hardware units ready for checkout.`);
            };

            return (
                <div>
                    <StudentBanner />
                    <Navbar cartCount={cartCount} onCartClick={handleCartView} />
                    <HeroSection />
                    <ProductCatalog onAddToCart={handleAddToCart} />
                    <Footer />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
